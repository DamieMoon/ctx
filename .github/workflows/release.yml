# ctx Release Pipeline — Multi-platform binaries
# Triggers on version tags (v*). Builds for 5 platforms, creates GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.14.0)"
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${TAG}"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: go
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="../ctx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X main.version=${{ steps.version.outputs.tag }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/ctx/
          echo "Built: ${BINARY} ($(du -h "${BINARY}" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ctx-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract tag annotation as release body
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Extract tag annotation (strips signature block, keeps message body)
          TAG_MSG=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")
          if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" = $'\n\n' ]; then
            TAG_MSG="Release $TAG"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$TAG_MSG"
            echo ""
            echo "## Installation"
            echo ""
            echo "**With Go:**"
            echo '```bash'
            echo "go install github.com/GottZ/ctx/cmd/ctx@${TAG}"
            echo '```'
            echo ""
            echo "**Binary download:**"
            echo "Download the binary for your platform, make it executable, move to PATH:"
            echo '```bash'
            echo "chmod +x ctx-*"
            echo "sudo mv ctx-* /usr/local/bin/ctx"
            echo '```'
            echo ""
            echo "**Verify the download:**"
            echo '```bash'
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Prüfsummen (Sweep 2026-09-19): die Binaries lagen ohne Integritätsanker
      # im Release. SHA256SUMS entsteht NACH dem Download aller Plattform-
      # Artefakte und wird mit hochgeladen (files: dist/*).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ctx ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          files: dist/*
          body: ${{ steps.notes.outputs.body }}
