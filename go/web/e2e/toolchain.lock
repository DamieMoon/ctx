# e2e/toolchain.lock — digest pins for the canonical e2e render environment.
#
# SINGLE SOURCE (design 06 §4.4, decision E4): e2e-visual.sh and (from wave
# PV8) the ci.yml web job read the image refs from here; nothing else may
# hard-code them. Tags ride along as human-readable labels — the digest wins.
#
# The toolchain image itself is built locally/in-CI from e2e/Dockerfile with
# these pinned bases (no published ghcr.io/gottz/ctx-e2e image exists yet; if
# PV8 publishes one, its digest ref is added here as TOOLCHAIN_IMAGE and the
# base pins document its provenance).
#
# Upgrade = digest bump here + baseline regeneration via `bash e2e-visual.sh
# --update`, as ONE coupled runbook step (wave PV9) — never separately.
PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
BUN_IMAGE=docker.io/oven/bun:1.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
